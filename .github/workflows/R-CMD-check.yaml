# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# bayests, which DESCRIPTION requires, is not on CRAN yet, so
# setup-r-dependencies below installs it from GitHub. DESCRIPTION carries no
# Remotes: field, which --as-cran would note and CRAN would not accept, so this
# workflow and the README's install instructions are where the GitHub source is
# named. Drop the github:: entry once bayests is on CRAN.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      # Needed by the "checking top-level files" step, which reads README.md and
      # NEWS.md; without it every run picks up a note.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # bayests is installed from GitHub until it is on CRAN; then drop the
      # github:: entry and let it resolve from there.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, github::franzmohr/bayests-r
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # The vignettes are precompiled, so there is nothing here to
          # evaluate; --no-manual because there is no LaTeX on the runners.
          build_args: 'c("--no-manual")'
